<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Surgical Innovation Engine (SIE)</title>
    <script type="text/javascript">
      // Auto-normalize casing to all-lowercase to prevent 404s
      var currentPath = window.location.pathname;
      if (/[A-Z]/.test(currentPath)) {
        var lowerUrl = window.location.origin + currentPath.toLowerCase() + window.location.search + window.location.hash;
        window.location.replace(lowerUrl);
      } else {
        // Single Page Application redirect for GitHub Pages
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body style="background: #020617; color: #38bdf8; font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
      <h2 style="color: #ffffff; margin-bottom: 8px;">🔬 Surgical Innovation Engine (SIE)</h2>
      <p style="color: #94a3b8; font-size: 14px;">Redirecting...</p>
    </div>
  </body>
</html>
