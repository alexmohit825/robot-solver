<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#030712"/>
      <stop offset="50%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00f2fe"/>
      <stop offset="100%" stopColor="#05d5b3"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#f59e0b"/>
      <stop offset="100%" stopColor="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Innovation Precision Hexagon Grid -->
  <polygon points="256,60 416,152 416,336 256,428 96,336 96,152" fill="none" stroke="#00f2fe" stroke-width="6" opacity="0.3" stroke-dasharray="8,6"/>
  <polygon points="256,90 390,167 390,321 256,398 122,321 122,167" fill="none" stroke="url(#cyanGlow)" stroke-width="8" filter="url(#glow)"/>

  <!-- Neural Constellation Synapses -->
  <line x1="256" y1="90" x2="256" y2="190" stroke="#00f2fe" stroke-width="3" opacity="0.6"/>
  <line x1="122" y1="167" x2="210" y2="220" stroke="#00f2fe" stroke-width="3" opacity="0.6"/>
  <line x1="390" y1="167" x2="302" y2="220" stroke="#00f2fe" stroke-width="3" opacity="0.6"/>
  <line x1="122" y1="321" x2="220" y2="290" stroke="#00f2fe" stroke-width="3" opacity="0.6"/>
  <line x1="390" y1="321" x2="292" y2="290" stroke="#00f2fe" stroke-width="3" opacity="0.6"/>
  
  <circle cx="256" cy="90" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="390" cy="167" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="390" cy="321" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="256" cy="398" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="122" cy="321" r="10" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="122" cy="167" r="10" fill="#00f2fe" filter="url(#glow)"/>

  <!-- Center Core: Stylized Surgical Scalpel / Titanium Diamond Burr Stylus -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Instrument Handle -->
    <rect x="240" y="240" width="32" height="150" rx="8" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <rect x="244" y="260" width="24" height="110" rx="4" fill="#0f172a"/>
    
    <!-- Gold / Amber Grip Knurl Rings -->
    <line x1="244" y1="280" x2="268" y2="280" stroke="#f59e0b" stroke-width="3"/>
    <line x1="244" y1="300" x2="268" y2="300" stroke="#f59e0b" stroke-width="3"/>
    <line x1="244" y1="320" x2="268" y2="320" stroke="#f59e0b" stroke-width="3"/>
    <line x1="244" y1="340" x2="268" y2="340" stroke="#f59e0b" stroke-width="3"/>

    <!-- Bayonet Offset Step -->
    <line x1="256" y1="240" x2="256" y2="170" stroke="url(#cyanGlow)" stroke-width="12" stroke-linecap="round"/>

    <!-- Surgical Diamond Micro-Blade / Acoustic Horn -->
    <polygon points="256,90 274,170 238,170" fill="url(#cyanGlow)" stroke="#ffffff" stroke-width="3"/>
    <polygon points="256,90 262,170 250,170" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Central Energy Spark -->
  <circle cx="256" cy="256" r="14" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>
</svg>
