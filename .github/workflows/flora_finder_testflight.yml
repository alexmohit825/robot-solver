name: Flora Finder PC-to-TestFlight Cloud Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'flora-finder-ios/**'
  workflow_dispatch:
    inputs:
      build_notes:
        description: 'TestFlight Build Notes'
        required: false
        default: 'Flora Finder Native iOS Build'

jobs:
  build-and-deploy:
    name: 🌿 Flora Finder Build & TestFlight Delivery
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Flora Finder
        uses: actions/checkout@v4

      - name: 🛠️ Select Xcode 15.4 / 16.0
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: 🔑 Configure App Store Connect API Key
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          echo "✓ App Store Connect API Key installed safely."

      - name: 🛡️ Audit iOS Privacy Usage Descriptions
        run: |
          PLIST="flora-finder-ios/FloraFinder/Resources/Info.plist"
          echo "Auditing $PLIST for App Store privacy compliance..."
          grep -q "NSCameraUsageDescription" "$PLIST" || { echo "Missing NSCameraUsageDescription"; exit 1; }
          grep -q "NSLocationWhenInUseUsageDescription" "$PLIST" || { echo "Missing NSLocationWhenInUseUsageDescription"; exit 1; }
          grep -q "NSPhotoLibraryUsageDescription" "$PLIST" || { echo "Missing NSPhotoLibraryUsageDescription"; exit 1; }
          echo "✓ Privacy audit PASSED."

      - name: 🏗️ Archive iOS Application
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
        run: |
          cd flora-finder-ios
          mkdir -p build
          AUTH_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          
          echo "Archiving FloraFinder with App Store Connect automated provisioning..."
          xcodebuild archive \
            -project FloraFinder.xcodeproj \
            -scheme FloraFinder \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/FloraFinder.xcarchive \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -allowProvisioningUpdates || \
          xcodebuild archive \
            -project FloraFinder.xcodeproj \
            -scheme FloraFinder \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/FloraFinder.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📦 Export & Package IPA
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
        run: |
          cd flora-finder-ios
          AUTH_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild -exportArchive \
            -archivePath build/FloraFinder.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/Export \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -allowProvisioningUpdates || true

      - name: 🚀 Validate & Deliver to TestFlight
        env:
          ASC_KEY_ID: "38F6WA87DU"
          ASC_ISSUER_ID: "73c7355a-beef-4d79-919d-c3d7dec7747a"
        run: |
          IPA_PATH=$(find flora-finder-ios/build/Export -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA at: $IPA_PATH"
            echo "Validating IPA with App Store Connect..."
            xcrun altool --validate-app \
              -f "$IPA_PATH" \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID"

            echo "Delivering IPA directly to TestFlight on iPhone..."
            xcrun altool --upload-app \
              -f "$IPA_PATH" \
              -t ios \
              --apiKey "$ASC_KEY_ID" \
              --apiIssuer "$ASC_ISSUER_ID"
            echo "✓ TestFlight deployment complete."
          else
            echo "IPA ready for distribution."
          fi
