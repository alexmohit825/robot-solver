name: Flora Finder PC-to-TestFlight Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'flora-finder-ios/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Active Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install App Store Connect API Key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_38F6WA87DU.p8

      - name: Verify iOS Privacy Audit
        run: |
          echo "Auditing Info.plist for required Apple privacy usage descriptions..."
          PLIST="flora-finder-ios/FloraFinder/Resources/Info.plist"
          grep -q "NSCameraUsageDescription" "$PLIST" || { echo "Missing NSCameraUsageDescription"; exit 1; }
          grep -q "NSLocationWhenInUseUsageDescription" "$PLIST" || { echo "Missing NSLocationWhenInUseUsageDescription"; exit 1; }
          grep -q "NSPhotoLibraryUsageDescription" "$PLIST" || { echo "Missing NSPhotoLibraryUsageDescription"; exit 1; }
          echo "Privacy audit PASSED."

      - name: Build and Archive iOS Application
        run: |
          cd flora-finder-ios
          xcodebuild archive \
            -project FloraFinder.xcodeproj \
            -scheme FloraFinder \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/FloraFinder.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA Archive
        run: |
          cd flora-finder-ios
          xcodebuild -exportArchive \
            -archivePath build/FloraFinder.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/Export \
            -allowProvisioningUpdates

      - name: Validate & Upload to TestFlight
        env:
          API_KEY: 38F6WA87DU
          API_ISSUER: 73c7355a-beef-4d79-919d-c3d7dec7747a
        run: |
          IPA_PATH=$(find flora-finder-ios/build/Export -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: IPA file was not generated."
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH"
          echo "Validating IPA with App Store Connect..."
          xcrun altool --validate-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY" \
            --apiIssuer "$API_ISSUER"

          echo "Uploading IPA directly to TestFlight..."
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$API_KEY" \
            --apiIssuer "$API_ISSUER"
          echo "Successfully delivered Flora Finder to TestFlight!"
